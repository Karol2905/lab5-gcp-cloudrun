name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Pruebas con cobertura
        run: npm run test:cov

      - name: Armar el artefacto
        run: |
          mkdir paquete-app
          cp -r src public package.json package-lock.json app.yaml paquete-app/

      - uses: actions/upload-artifact@v4
        with:
          name: paquete-app
          path: paquete-app

  desplegar:
    needs: construir-y-probar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete-app
          path: paquete-app

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en App Engine
        working-directory: paquete-app
        run: gcloud app deploy --quiet --project ${{ vars.GCP_PROJECT_ID }}

      - name: Prueba de humo
        run: |
          HOST=$(gcloud app describe --project ${{ vars.GCP_PROJECT_ID }} --format="value(defaultHostname)")
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$HOST/health"; then exit 0; fi
            echo "Intento $i fallido, reintentando..."; sleep 10
          done
          exit 1
